<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f0ece3"><meta name="description" content="Mia 故事档案馆 · 沉浸式阅读室"><title>THE READING ROOM — Mia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{--paper:#f0ece3;--ink:#292923;--muted:#77766e;--gold:#92764f;--serif:'Cormorant Garamond',serif;--cn:'Noto Serif SC',serif;--art:'ZCOOL XiaoWei','Noto Serif SC',serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--paper)}body{margin:0;color:var(--ink);background:linear-gradient(180deg,#f4f0e8,#ebe6dc);font-family:var(--cn)}a{color:inherit;text-decoration:none}button{font:inherit}a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:15px clamp(18px,5vw,65px);background:#f0ece3e8;backdrop-filter:blur(12px);border-bottom:1px solid #29292318}.top a,.top span{font:11px var(--serif);letter-spacing:.14em;color:#6e6b61}.progress{position:absolute;left:0;bottom:-1px;height:2px;background:#a68a60;width:0;transition:width .1s linear}.layout{display:grid;grid-template-columns:190px minmax(0,700px);gap:55px;justify-content:center;width:min(1040px,calc(100% - 40px));margin:0 auto}.toc{position:sticky;top:75px;align-self:start;padding:65px 0 40px;max-height:calc(100vh - 75px);overflow:auto}.toc-label{font:10px var(--serif);letter-spacing:.2em;color:#9a8b72;margin-bottom:18px}.toc a{display:block;font-size:12px;line-height:1.8;color:#77766e;padding:7px 0;border-bottom:1px solid #29292310}.toc a.active{color:#8b6e45}.article{padding:85px 0 110px;min-width:0}.kicker{font:11px var(--serif);letter-spacing:.22em;color:var(--gold)}h1{font:400 clamp(39px,6vw,64px)/1.25 var(--art);letter-spacing:.06em;margin:22px 0 8px}.english{font:italic 18px var(--serif);letter-spacing:.12em;color:#77766e}.dek{font-size:14px;line-height:2.1;color:#69685f;margin:30px 0 20px;max-width:560px}.meta{font:11px var(--serif);letter-spacing:.12em;color:#88857a}.chapter{padding-top:70px;margin-top:50px;border-top:1px solid #29292320;scroll-margin-top:80px}.chapter-no{font:11px var(--serif);letter-spacing:.2em;color:#9a825e}.chapter h2{font:400 clamp(25px,4vw,34px) var(--art);letter-spacing:.06em;margin:13px 0 35px}.prose{font-size:15px;line-height:2.35;letter-spacing:.035em;color:#34342e}.prose p{margin:0 0 1.15em;min-height:1em}.endnote{margin-top:80px;padding:34px 0;border-top:1px solid #29292320;text-align:center}.endnote .label{font:10px var(--serif);letter-spacing:.22em;color:var(--gold)}.endnote h2{font:400 25px var(--art);margin:17px 0}.endnote p{font-size:14px;line-height:2;color:#6d6b62}.chapter-nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px}.chapter-nav a{font-size:12px;color:#8b6e45;border:1px solid #92764f55;padding:10px 13px}.chapter-nav a[aria-disabled=true]{opacity:.35;pointer-events:none}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}.button{display:inline-flex;padding:12px 17px;border:1px solid #92764f70;font-size:12px;letter-spacing:.06em}.button.primary{background:#92764f;color:#fff}.error{padding:100px 0;text-align:center;color:#6d6b62}
@media(max-width:760px){.layout{display:block;width:calc(100% - 38px)}.toc{position:relative;top:auto;max-height:none;display:flex;gap:12px;overflow-x:auto;padding:18px 0 8px;white-space:nowrap}.toc-label{display:none}.toc a{flex:0 0 auto;border:1px solid #29292318;padding:7px 10px}.article{padding:55px 0 85px}.chapter{padding-top:45px;margin-top:35px}.prose{font-size:14px;line-height:2.25}.top{padding:13px 17px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head>
<body><header class="top"><a href="stories.html">← THE STORY ARCHIVE</a><span id="read-label">MIA · READING ROOM</span><div class="progress" id="progress"></div></header>
<div class="layout"><aside class="toc" id="toc" aria-label="章节目录"><div class="toc-label">CHAPTERS</div></aside><main class="article" id="article"><div class="error">正在打开故事……</div></main></div>
<script>
(async()=>{const article=document.getElementById('article'),toc=document.getElementById('toc'),params=new URLSearchParams(location.search),id=params.get('id');try{const response=await fetch('data/stories.json',{cache:'no-store'});if(!response.ok)throw new Error();const data=await response.json(),story=(data.stories||[]).find(item=>item.id===id);if(!story)throw new Error();document.title=story.title+' — Mia Reading Room';document.getElementById('read-label').textContent=story.number+' · READING ROOM';article.replaceChildren();toc.querySelectorAll('a').forEach(x=>x.remove());const kicker=document.createElement('div');kicker.className='kicker';kicker.textContent='MIA · '+(story.number||'STORY');const title=document.createElement('h1');title.textContent=story.title;const english=document.createElement('div');english.className='english';english.textContent=story.englishTitle||'';const dek=document.createElement('p');dek.className='dek';dek.textContent=story.subtitle||story.description||'';const meta=document.createElement('div');meta.className='meta';meta.textContent=(story.category||[]).join(' / ')+'　·　'+(story.readingTime||'');article.append(kicker,title,english,dek,meta);(story.chapters||[]).forEach((chapter,index)=>{const section=document.createElement('section');section.className='chapter';section.id='chapter-'+(index+1);const no=document.createElement('div');no.className='chapter-no';no.textContent='CHAPTER '+String(index+1).padStart(2,'0');const h=document.createElement('h2');h.textContent=chapter.title;const prose=document.createElement('div');prose.className='prose';(chapter.body||[]).forEach(line=>{const p=document.createElement('p');p.textContent=line;prose.appendChild(p)});section.append(no,h,prose);article.appendChild(section);const chapterNav=document.createElement('nav');chapterNav.className='chapter-nav';const previous=document.createElement('a');previous.href=index?'#chapter-'+index:'#';previous.textContent='← 上一章';previous.setAttribute('aria-disabled',String(index===0));const next=document.createElement('a');next.href=index<(story.chapters.length-1)?'#chapter-'+(index+2):'#reading-end';next.textContent='下一章 →';next.setAttribute('aria-disabled',String(index===story.chapters.length-1));chapterNav.append(previous,next);section.appendChild(chapterNav);const link=document.createElement('a');link.href='#'+section.id;link.textContent=String(index+1).padStart(2,'0')+' · '+chapter.title;link.addEventListener('click',()=>{toc.querySelectorAll('a').forEach(a=>a.classList.remove('active'));link.classList.add('active')});toc.appendChild(link)});const end=document.createElement('section');end.className='endnote';end.id='reading-end';const label=document.createElement('div');label.className='label';label.textContent='MIA · READING ECHO';const echoTitle=document.createElement('h2');echoTitle.textContent='故事结束了，但问题还在继续。';const echo=document.createElement('p');echo.textContent=story.afterwordQuestion||'读完这个故事，你最想继续追问什么？';const actions=document.createElement('div');actions.className='actions';const back=document.createElement('a');back.className='button primary';back.href='stories.html';back.textContent='返回故事档案馆';const world=document.createElement('a');world.className='button';world.href='world.html?space=archive';world.textContent='回到 Mia 的世界';actions.append(back,world);end.append(label,echoTitle,echo,actions);article.appendChild(end);const key='mia-story-progress:'+story.id;try{const saved=localStorage.getItem(key);if(saved){const target=document.getElementById('chapter-'+saved);if(target){const resume=document.createElement('a');resume.className='button';resume.href='#'+target.id;resume.textContent='继续上次阅读 · 第 '+saved+' 章';meta.after(resume)}}}catch(_){}let last=0;const update=()=>{const max=document.documentElement.scrollHeight-innerHeight,p=max>0?Math.min(100,Math.max(0,scrollY/max*100)):0;document.getElementById('progress').style.width=p+'%';const chapters=[...document.querySelectorAll('.chapter')];let current=0;chapters.forEach((node,index)=>{if(node.getBoundingClientRect().top<innerHeight*.42)current=index+1});if(current&&current!==last){last=current;try{localStorage.setItem(key,String(current))}catch(_){}toc.querySelectorAll('a').forEach((a,index)=>a.classList.toggle('active',index===current-1))}};window.addEventListener('scroll',update,{passive:true});update()}catch(error){article.innerHTML='<div class="error"><p>暂时找不到这篇故事。</p><a class="button" href="stories.html">返回故事档案馆</a></div>'}})();
</script></body></html>
