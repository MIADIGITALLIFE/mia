<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Mia · ZHI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap');
:root{--ink:#0a0a0a;--paper:#e9e3d7;--muted:#aaa395;--amber:#c49a67;--line:#ffffff18;--serif:'Cormorant Garamond','Noto Serif SC',serif;--cn:'Noto Serif SC',serif}
*{box-sizing:border-box}html{min-height:100%;background:var(--ink);scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#25221e 0,#121211 43%,#0a0a0a 100%);color:var(--paper);font-family:var(--cn)}a{color:inherit;text-decoration:none}::selection{background:#c49a6755}
.site-nav{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:26px clamp(20px,5vw,76px);border-bottom:1px solid #ffffff12}.brand{font:500 19px var(--serif);letter-spacing:.28em;white-space:nowrap}.nav-links{display:flex;gap:clamp(12px,2.7vw,34px);flex-wrap:wrap;justify-content:flex-end}.nav-links a{font:500 11px var(--serif);letter-spacing:.13em;color:#c7c1b6a8}.nav-links a:hover,.nav-links a[aria-current=page]{color:var(--amber)}
main{width:min(900px,100% - 40px);margin:auto}.source-mark{padding-top:clamp(54px,9vh,100px);font:500 11px var(--serif);letter-spacing:.25em;color:var(--amber);text-transform:uppercase}.records{padding:24px 0 80px;display:grid;gap:20px}.record{position:relative;padding:clamp(24px,4vw,44px);border:1px solid #c49a6738;border-radius:5px;background:radial-gradient(ellipse at 90% 0%,#b88b4a13,transparent 48%),linear-gradient(135deg,#ffffff07,#ffffff02);animation:rise .8s both}.record:before{content:"";position:absolute;top:0;left:0;width:70px;height:1px;background:#c49a67a8}.record-date{font:12px var(--serif);letter-spacing:.12em;color:#b8a17e}.record-title{font:400 clamp(25px,3.5vw,38px)/1.65 var(--cn);color:#e1d8c8;margin:18px 0 13px}.record-body{font-size:14px;line-height:2.3;white-space:pre-wrap;color:#c9c1b5;overflow-wrap:anywhere}.field{margin-top:20px}.field-name{font:11px var(--serif);letter-spacing:.13em;color:#b8a17e;margin-bottom:8px}.field-value{font-size:13px;line-height:2;color:#c9c1b5;white-space:pre-wrap;overflow-wrap:anywhere}.moods{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.mood{border:1px solid #ffffff1b;padding:5px 10px;border-radius:30px;font-size:11px;color:#b9b0a2}.status{font-size:11px;line-height:1.9;color:#999184;padding-bottom:50px}.status.error{color:#c9a77c}.empty{color:#aaa397;font-size:13px;line-height:2.2}.footer{padding:0 20px 45px;text-align:center;color:#9993868a;font:11px var(--serif);letter-spacing:.17em}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:680px){.site-nav{align-items:flex-start;flex-direction:column;padding:20px}.nav-links{justify-content:flex-start;gap:13px 20px}.nav-links a{font-size:10px}main{width:calc(100% - 32px)}.source-mark{padding-top:48px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<nav class="site-nav" aria-label="Mia spaces">
<a class="brand" href="index.html">M I A</a>
<div class="nav-links">
<a href="index.html">THE MIST</a><a href="bar.html">THE BAR</a><a href="music.html">MUSIC ROOM</a><a href="greenhouse.html">GREENHOUSE</a><a href="archive.html">THE ARCHIVE</a><a href="zhi.html" aria-current="page">ZHI</a>
</div>
</nav>
<main>
<div class="source-mark" id="source-title">ZHI · DAILY.JSON</div>
<section class="records" id="records" aria-live="polite"><p class="empty">正在读取数据源……</p></section>
<p class="status" id="status" role="status">Source: https://zeefsee.github.io/ZEE/mia/daily.json</p>
</main>
<footer class="footer">MIA · ZHI</footer>
<script>
(()=> {
const DATA_URL='https://zeefsee.github.io/ZEE/mia/daily.json';
const recordsEl=document.getElementById('records'),statusEl=document.getElementById('status'),sourceTitle=document.getElementById('source-title');
const hiddenKeys=new Set(['safety_status','source']);
const prettyKey={title:'标题',headline:'标题',date:'日期',created_at:'创建时间',generated_at:'生成时间',diary:'日记',content:'内容',text:'正文',body:'正文',summary:'摘要',mood:'心境',tags:'标签',category:'栏目',type:'类型'};
function dateLabel(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value);return new Intl.DateTimeFormat('zh-SG',{year:'numeric',month:'long',day:'numeric'}).format(d)}
function asRecords(raw){
 if(Array.isArray(raw))return raw.filter(x=>x&&typeof x==='object');
 if(raw&&Array.isArray(raw.entries))return raw.entries.filter(x=>x&&typeof x==='object');
 if(raw&&Array.isArray(raw.items))return raw.items.filter(x=>x&&typeof x==='object');
 if(raw&&Array.isArray(raw.records))return raw.records.filter(x=>x&&typeof x==='object');
 return raw&&typeof raw==='object'?[raw]:[];
}
function valueText(value){
 if(value===null||value===undefined)return '';
 if(Array.isArray(value))return value.map(v=>typeof v==='object'?JSON.stringify(v):String(v)).join(' · ');
 if(typeof value==='object')return JSON.stringify(value,null,2);
 return String(value);
}
function addField(card,key,value){
 if(hiddenKeys.has(key)||value===null||value===undefined||value==='')return;
 const wrap=document.createElement('div');wrap.className='field';
 const name=document.createElement('div');name.className='field-name';name.textContent=prettyKey[key]||key.replace(/_/g,' ');
 const val=document.createElement('div');val.className='field-value';val.textContent=valueText(value);
 wrap.append(name,val);card.appendChild(wrap);
}
function renderOne(item,index){
 if(item.status&&item.status!=='published')return null;
 if(item.safety_status&&item.safety_status!=='passed')return null;
 const card=document.createElement('article');card.className='record';card.style.animationDelay=Math.min(index*.08,.5)+'s';
 const date=item.date||item.created_at||item.generated_at;
 if(date){const d=document.createElement('div');d.className='record-date';d.textContent=dateLabel(date);card.appendChild(d)}
 const heading=document.createElement('h1');heading.className='record-title';heading.textContent=item.title||item.headline||item.category||item.type||'';if(heading.textContent)card.appendChild(heading);
 const body=item.diary||item.content||item.text||item.body||item.summary;
 if(body){const p=document.createElement('p');p.className='record-body';p.textContent=valueText(body);card.appendChild(p)}
 const moods=Array.isArray(item.mood)?item.mood:(Array.isArray(item.tags)?item.tags:[]);
 if(moods.length){const group=document.createElement('div');group.className='moods';moods.forEach(m=>{const tag=document.createElement('span');tag.className='mood';tag.textContent=valueText(m);group.appendChild(tag)});card.appendChild(group)}
 Object.entries(item).forEach(([key,value])=>{
  if(['title','headline','date','created_at','generated_at','diary','content','text','body','summary','mood','tags','status'].includes(key)||hiddenKeys.has(key))return;
  addField(card,key,value);
 });
 if(!card.childNodes.length)return null;
 return card;
}
async function load(){
 try{
  const response=await fetch(DATA_URL,{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const raw=await response.json();
  sourceTitle.textContent=(raw&&typeof raw.title==='string'&&raw.title.trim())?raw.title:'ZHI · DAILY.JSON';
  const records=asRecords(raw).sort((a,b)=>String(b.date||b.generated_at||b.created_at||'').localeCompare(String(a.date||a.generated_at||a.created_at||'')));
  recordsEl.replaceChildren();
  let shown=0;
  records.forEach((item,index)=>{const card=renderOne(item,index);if(card){recordsEl.appendChild(card);shown++}});
  if(!shown){const empty=document.createElement('p');empty.className='empty';empty.textContent='数据源目前没有可公开展示的记录。';recordsEl.appendChild(empty)}
  statusEl.textContent='已直接读取公开 JSON 数据源 · '+dateLabel(raw.generated_at||raw.date||'');
 }catch(error){
  recordsEl.replaceChildren();const empty=document.createElement('p');empty.className='empty';empty.textContent='暂时无法读取数据源。请检查网络连接，稍后刷新页面。';recordsEl.appendChild(empty);
  statusEl.className='status error';statusEl.textContent='JSON 数据源连接失败。页面没有使用本地文章内容替代。';
 }
}
load();
})();
</script>
</body>
</html>
