name: Bilingual browser acceptance

on:
  pull_request:
    paths:
      - "en/**"
      - "zh/**"
      - "*.html"
      - "scripts/test-bilingual-browser.mjs"
      - ".github/workflows/bilingual-browser-acceptance.yml"
  push:
    branches:
      - "feature/mia-bilingual-foundation"
    paths:
      - "en/**"
      - "zh/**"
      - "*.html"
      - "scripts/test-bilingual-browser.mjs"
      - ".github/workflows/bilingual-browser-acceptance.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository at GitHub Pages project path
        run: |
          cd ..
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mia-http.log 2>&1 &
          echo $! > /tmp/mia-http.pid
      - name: Run desktop and mobile browser acceptance smoke tests
        run: node scripts/test-bilingual-browser.mjs
