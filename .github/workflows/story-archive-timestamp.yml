name: Story Archive Timestamp

on:
  push:
    branches: [main]
    paths:
      - 'data/stories.json'
      - 'scripts/stamp-stories.js'
      - '.github/workflows/story-archive-timestamp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: story-archive-timestamp
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add timestamps to newly archived stories
        run: node scripts/stamp-stories.js
      - name: Commit timestamp updates
        run: |
          if git diff --quiet -- data/stories.json; then
            echo "No timestamp changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stories.json
          git commit -m "chore(stories): preserve archive timestamps [skip ci]"
          git push
