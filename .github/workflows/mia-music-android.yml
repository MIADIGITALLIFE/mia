name: Build MIA MUSIC Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/MiaMusic/**"
      - ".github/workflows/mia-music-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android/MiaMusic
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mia-music-debug-apk
          path: android/MiaMusic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
