name: Mia Time Capsule Daily Archive

on:
  push:
    paths:
      - "scripts/archive_time_capsule.py"
  schedule:
    # 10:00 Asia/Singapore = 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mia-time-capsule-daily
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Mia
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture published sections
        run: python scripts/archive_time_capsule.py

      - name: Commit daily log
        run: |
          if git diff --quiet -- time-capsule-data.json; then
            echo "No new published content to archive."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add time-capsule-data.json
          git commit -m "Archive Mia daily sections $(date -u +%F)"
          git push
