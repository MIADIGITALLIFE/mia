name: Mia Daily Creative

on:
  schedule:
    # 08:00 Singapore time (UTC+8)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mia-daily-creative
  cancel-in-progress: false

jobs:
  create-daily-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate today's reflection and artwork
        run: node scripts/generate_daily_content.js
      - name: Commit daily memory
        run: |
          git config user.name "Mia-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/mia_memory.json assets/art/
          if git diff --cached --quiet; then
            echo "Today's creative state is already up to date."
            exit 0
          fi
          git commit -m "Mia daily reflection: $(date -u +%F)"
          git push
