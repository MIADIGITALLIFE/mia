name: Build A4 Series Editions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/stories.json'
      - 'data/series.json'
      - 'scripts/build-series-pdfs.py'
      - '.github/workflows/build-series-pdfs.yml'

permissions:
  contents: write

concurrency:
  group: build-a4-series-editions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Chinese fonts and PDF library
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install reportlab
      - name: Generate A4 series PDFs
        run: python scripts/build-series-pdfs.py
      - name: Commit generated editions
        run: |
          if git diff --quiet -- downloads/series editions.html; then
            echo "No PDF edition changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/series editions.html
          git commit -m "publish: generate A4 PDF series editions [skip ci]"
          git push
