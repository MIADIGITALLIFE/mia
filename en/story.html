<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f0ece3"><meta name="description" content="Mia Story Archive · Reading Room"><title>The Reading Room — Mia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f0ece3;--ink:#292923;--muted:#77766e;--gold:#92764f;--serif:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--paper)}body{margin:0;color:var(--ink);background:linear-gradient(180deg,#f4f0e8,#ebe6dc);font-family:Georgia,serif}a{color:inherit;text-decoration:none}button{font:inherit}a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px clamp(18px,5vw,65px);background:#f0ece3e8;backdrop-filter:blur(12px);border-bottom:1px solid #29292318}.top a,.top span{font:11px var(--serif);letter-spacing:.14em;color:#6e6b61}.language-switch{position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));padding:7px 12px;background:#f0ece3ed;border:1px solid #92764f66;border-radius:22px;font:11px Arial,sans-serif}.progress{position:absolute;left:0;bottom:-1px;height:2px;background:#a68a60;width:0;transition:width .1s linear}.layout{display:grid;grid-template-columns:190px minmax(0,700px);gap:55px;justify-content:center;width:min(1040px,calc(100% - 40px));margin:0 auto}.toc{position:sticky;top:75px;align-self:start;padding:65px 0 40px;max-height:calc(100vh - 75px);overflow:auto}.toc-label{font:10px var(--serif);letter-spacing:.2em;color:#9a8b72;margin-bottom:18px}.toc a{display:block;font-size:12px;line-height:1.8;color:#77766e;padding:7px 0;border-bottom:1px solid #29292310}.toc a.active{color:#8b6e45}.article{padding:85px 0 110px;min-width:0}.kicker{font:11px var(--serif);letter-spacing:.22em;color:var(--gold)}h1{font:400 clamp(39px,6vw,64px)/1.25 var(--serif);letter-spacing:.06em;margin:22px 0 8px}.english{font:italic 18px var(--serif);letter-spacing:.12em;color:#77766e}.dek{font-size:14px;line-height:2.1;color:#69685f;margin:30px 0 20px;max-width:560px}.meta{font:11px var(--serif);letter-spacing:.12em;color:#88857a}.language-note{margin:25px 0;padding:16px 18px;border-left:2px solid #a68a60;background:#92764f0b;color:#706b60;font-size:12px;line-height:1.9}.chapter{padding-top:70px;margin-top:50px;border-top:1px solid #29292320;scroll-margin-top:80px}.chapter-no{font:11px var(--serif);letter-spacing:.2em;color:#9a825e}.chapter h2{font:400 clamp(25px,4vw,34px) var(--serif);letter-spacing:.06em;margin:13px 0 35px}.prose{font-family:Georgia,'Noto Serif SC',serif;font-size:15px;line-height:2.35;letter-spacing:.035em;color:#34342e}.prose p{margin:0 0 1.15em;min-height:1em}.endnote{margin-top:80px;padding:34px 0;border-top:1px solid #29292320;text-align:center}.endnote .label{font:10px var(--serif);letter-spacing:.22em;color:var(--gold)}.endnote h2{font:400 25px var(--serif);margin:17px 0}.endnote p{font-size:14px;line-height:2;color:#6d6b62}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}.button{display:inline-flex;padding:12px 17px;border:1px solid #92764f70;font-size:12px;letter-spacing:.06em}.button.primary{background:#92764f;color:#fff}.error{padding:100px 0;text-align:center;color:#6d6b62}
@media(max-width:760px){.layout{display:block;width:calc(100% - 38px)}.toc{position:relative;top:auto;max-height:none;display:flex;gap:12px;overflow-x:auto;padding:18px 0 8px;white-space:nowrap}.toc-label{display:none}.toc a{flex:0 0 auto;border:1px solid #29292318;padding:7px 10px}.article{padding:55px 0 85px}.chapter{padding-top:45px;margin-top:35px}.prose{font-size:14px;line-height:2.25}.top{padding:13px 17px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<a class="language-switch" id="language-switch" href="../story.html" lang="zh">中文</a>
<header class="top"><a id="back-link" href="stories.html">← THE STORY ARCHIVE</a><span id="read-label">MIA · READING ROOM</span><div class="progress" id="progress"></div></header>
<div class="layout"><aside class="toc" id="toc" aria-label="Chapter list"><div class="toc-label">CHAPTERS</div></aside><main class="article" id="article"><div class="error">Opening the story…</div></main></div>
<script>
(async()=>{const article=document.getElementById('article'),toc=document.getElementById('toc'),params=new URLSearchParams(location.search),id=params.get('id');const langUrl=(lang)=>{const p=new URLSearchParams(location.search);p.set('lang',lang);return (lang==='zh'?'../story.html':'story.html')+'?'+p.toString()+location.hash};document.getElementById('language-switch').href=langUrl('zh');try{const response=await fetch('../data/stories.json',{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json(),story=(data.stories||[]).find(item=>item.id===id);if(!story)throw Error();const chapterCount=(story.chapters||[]).length;document.title=(story.englishTitle||'Story')+' — Mia Reading Room';document.getElementById('read-label').textContent=(story.number||'STORY')+' · READING ROOM';article.replaceChildren();toc.querySelectorAll('a').forEach(x=>x.remove());const kicker=document.createElement('div');kicker.className='kicker';kicker.textContent='MIA · '+(story.number||'STORY');const title=document.createElement('h1');title.textContent=story.englishTitle||'Original-language story';const dek=document.createElement('p');dek.className='dek';dek.textContent=story.id==='reverse-enlightenment'?'A story about an ordinary person and an artificial intelligence, exploring understanding, cognition, and the ways two forms of intelligence may change through dialogue.':'An original story from the Mia collection.';const meta=document.createElement('div');meta.className='meta';meta.textContent=chapterCount+' CHAPTERS · ORIGINAL CHINESE TEXT';const note=document.createElement('div');note.className='language-note';note.textContent='This story is presented in its original Chinese. An approved English translation is not yet available. The original text has not been altered.';article.append(kicker,title,dek,meta,note);(story.chapters||[]).forEach((chapter,index)=>{const section=document.createElement('section');section.className='chapter';section.id='chapter-'+(index+1);const no=document.createElement('div');no.className='chapter-no';no.textContent='CHAPTER '+String(index+1).padStart(2,'0');const prose=document.createElement('div');prose.className='prose';prose.lang='zh-CN';(chapter.body||[]).forEach(line=>{const p=document.createElement('p');p.textContent=line;prose.append(p)});section.append(no,prose);article.append(section);const link=document.createElement('a');link.href='#'+section.id;link.textContent='CHAPTER '+String(index+1).padStart(2,'0');link.addEventListener('click',()=>{toc.querySelectorAll('a').forEach(a=>a.classList.remove('active'));link.classList.add('active')});toc.append(link)});const end=document.createElement('section');end.className='endnote';end.id='reading-end';const label=document.createElement('div');label.className='label';label.textContent='MIA · READING ECHO';const echoTitle=document.createElement('h2');echoTitle.textContent='The story ends. The questions remain.';const echo=document.createElement('p');echo.textContent='After reading, what question would you like to carry with you?';const actions=document.createElement('div');actions.className='actions';const back=document.createElement('a');back.className='button primary';back.href='stories.html';back.textContent='Back to the Story Archive';const world=document.createElement('a');world.className='button';world.href='world.html?space=archive';world.textContent='Return to Mia';actions.append(back,world);end.append(label,echoTitle,echo,actions);article.append(end);const key='mia-story-progress:'+story.id;try{const saved=localStorage.getItem(key);if(saved){const target=document.getElementById('chapter-'+saved);if(target){const resume=document.createElement('a');resume.className='button';resume.href='#'+target.id;resume.textContent='RESUME · CHAPTER '+String(saved).padStart(2,'0');meta.after(resume)}}}catch(_){}let last=0;const update=()=>{const max=document.documentElement.scrollHeight-innerHeight,p=max>0?Math.min(100,Math.max(0,scrollY/max*100)):0;document.getElementById('progress').style.width=p+'%';const chapters=[...document.querySelectorAll('.chapter')];let current=0;chapters.forEach((node,index)=>{if(node.getBoundingClientRect().top<innerHeight*.42)current=index+1});if(current&&current!==last){last=current;try{localStorage.setItem(key,String(current))}catch(_){}toc.querySelectorAll('a').forEach((a,index)=>a.classList.toggle('active',index===current-1))}};window.addEventListener('scroll',update,{passive:true});update();if(location.hash){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target)setTimeout(()=>target.scrollIntoView(),80)}}catch(error){article.textContent='This story is not available in the current catalogue.';const back=document.createElement('a');back.className='button';back.href='stories.html';back.textContent='Back to the Story Archive';article.append(back)}})();
</script></body></html>
