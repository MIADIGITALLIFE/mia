 <text x="360" y="145" fill="#d7cfbd" font-family="Georgia,serif" font-size="15" letter-spacing="6">MIA · STORY CORRIDOR</text>
 <text x="360" y="292" fill="#f0eadc" font-family="'Noto Serif SC','Songti SC',serif" font-size="48" letter-spacing="5">你不是岛屿，</text>
 <text x="360" y="365" fill="#f0eadc" font-family="'Noto Serif SC','Songti SC',serif" font-size="54" letter-spacing="7">你是群岛</text>
 <path d="M240 415H480" stroke="#d4c19b" stroke-width="1" opacity=".75"/>
