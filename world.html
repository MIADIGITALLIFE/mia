<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><title>Mia — A World That Keeps Listening</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#f2eee5}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0a0a0a}.player{position:fixed;z-index:30;right:20px;bottom:20px;display:flex;align-items:center;gap:12px;padding:8px 9px 8px 15px;border:1px solid #e8dfc944;border-radius:40px;background:rgba(20,20,18,.88);backdrop-filter:blur(14px);box-shadow:0 8px 30px #101a1638}.copy{display:flex;flex-direction:column;gap:2px;min-width:100px}.copy strong{font:500 11px Georgia,serif;letter-spacing:.16em}.copy small{font:10px Arial,sans-serif;color:#d0d0c4a8}#music-toggle{display:grid;place-items:center;width:42px;height:42px;border:1px solid #e8dfc966;border-radius:50%;background:#c49a67;color:#20201b;font-size:17px;cursor:pointer}#music-toggle:focus-visible{outline:2px solid #f2eee5;outline-offset:4px}@media(max-width:560px){.player{right:12px;bottom:12px}.copy{min-width:82px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><iframe id="mia-space" name="mia-space" src="index.html" title="Mia 的潜意识咖啡馆" allow="autoplay"></iframe><div class="player" aria-label="Mia 全站共享音乐播放器"><div class="copy"><strong>STAY A LITTLE</strong><small id="music-status" aria-live="polite">声音还在这里</small></div><button id="music-toggle" type="button" aria-label="播放背景音乐" title="播放背景音乐">♫</button></div><script>
(()=> {
 const frame=document.getElementById('mia-space'),button=document.getElementById('music-toggle'),status=document.getElementById('music-status');
 try{const s=new URLSearchParams(location.search).get('space');if(['bar','music','greenhouse','archive'].includes(s))frame.src=s+'.html'}catch(_){}
 const moods={
  'synth:tearful':{name:'深蓝 · 慢弦',notes:[110,130.81,164.81,146.83],step:4.8,wave:'sine',base:55,filter:520,volume:.10,pan:0},
  'synth:dazing':{name:'琥珀色的光斑',notes:[220,261.63,329.63,293.66,196,246.94],step:3.6,wave:'triangle',base:110,filter:850,volume:.075,pan:.12},
  'synth:forest':{name:'森林梦境 · 流动的音符',notes:[261.63,329.63,392,493.88,440,392,329.63,293.66],step:1.45,wave:'sine',base:130.81,filter:1500,volume:.065,pan:-.12}
 };
 let ctx=null,master=null,lowpass=null,active=[],timer=null,playing=false,track='synth:tearful',stepIndex=0,nextAt=0;
 const read=k=>{try{return localStorage.getItem(k)}catch(_){return null}},write=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
 function clearNodes(){active.forEach(n=>{try{n.stop()}catch(_){}});active=[]}
 function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC){status.textContent='此浏览器暂不支持实时合成';return}ctx=new AC();master=ctx.createGain();master.gain.value=0;lowpass=ctx.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.value=1100;lowpass.connect(master);master.connect(ctx.destination)}
 function tone(freq,when,duration,kind,vol,detune=0){const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind;o.frequency.setValueAtTime(freq,when);o.detune.setValueAtTime(detune,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol*1.8),when+.8);g.gain.setTargetAtTime(.0001,when+duration*.55,Math.max(.15,duration*.16));o.connect(g);g.connect(lowpass);active.push(o);o.onended=()=>{active=active.filter(x=>x!==o);try{o.disconnect();g.disconnect()}catch(_){}};o.start(when);o.stop(when+duration)}
 function drone(){const m=moods[track];tone(m.base,ctx.currentTime,7,'sine',m.volume*.7,-3);tone(m.base*1.5,ctx.currentTime+.08,6.5,'sine',m.volume*.28,4)}
 function tick(){if(!playing||!ctx)return;const m=moods[track];const now=ctx.currentTime;if(nextAt<now)nextAt=now+.08;while(nextAt<now+1.2){const note=m.notes[stepIndex%m.notes.length];tone(note,nextAt,m.step*1.8,m.wave,m.volume*(track==='synth:forest'?.65:.48),Math.sin(stepIndex*.7)*5);if(stepIndex%4===0)tone(m.base*(stepIndex%8===0?1:1.25),nextAt+.12,m.step*2,'sine',m.volume*.42);if(track==='synth:dazing'&&stepIndex%3===1)tone(note*2,nextAt+.45,m.step*.9,'triangle',m.volume*.16,7);if(track==='synth:forest'&&stepIndex%2===0)tone(note*2,nextAt+.18,m.step*.75,'sine',m.volume*.15,-5);nextAt+=m.step;stepIndex++}}
 async function start(){init();if(!ctx)return;try{await ctx.resume()}catch(_){status.textContent='请允许浏览器播放声音';return}if(playing){paint();return}playing=true;const m=moods[track];lowpass.frequency.setTargetAtTime(m.filter,ctx.currentTime,1.5);master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(.0001,ctx.currentTime,.01);master.gain.setTargetAtTime(.88,ctx.currentTime,1.8);nextAt=ctx.currentTime+.2;drone();tick();timer=setInterval(tick,450);write('mia-music-enabled','yes');paint()}
 function stop(){playing=false;if(timer){clearInterval(timer);timer=null}if(ctx&&master){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(.0001,ctx.currentTime,.25)}clearNodes();write('mia-music-enabled','no');paint()}
 function paint(){button.textContent=playing?'Ⅱ':'♫';button.setAttribute('aria-label',playing?'暂停合成音乐':'播放合成音乐');button.title=playing?'暂停合成音乐':'播放合成音乐';status.textContent=playing?'实时合成 · '+moods[track].name:'点一下，让声音回来'}
 async function selectTrack(id,title,shouldPlay=true){if(!moods[id])return;const changed=track!==id;track=id;stepIndex=0;if(changed&&playing){if(timer){clearInterval(timer);timer=null}clearNodes();lowpass.frequency.setTargetAtTime(moods[track].filter,ctx.currentTime,1.4);nextAt=ctx.currentTime+.2;drone();tick();timer=setInterval(tick,450)}status.textContent='已选择 · '+(title||moods[track].name);if(shouldPlay)await start();else paint()}
 button.addEventListener('click',()=>playing?stop():start());
 window.addEventListener('message',e=>{if(!e.data||typeof e.data!=='object')return;if(e.data.type==='mia:track')selectTrack(e.data.track,e.data.title,true);else if(e.data.type==='mia:enter'||e.data.type==='mia:play')start()});
 const remembered=read('mia-synth-track');if(moods[remembered])track=remembered;
 const originalSelect=selectTrack;
 window.addEventListener('message',e=>{if(e.data&&e.data.type==='mia:track'&&moods[e.data.track])write('mia-synth-track',e.data.track)});
 paint();
})();
</script></body></html>
