<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><title>Mia — A World That Keeps Listening</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#f2eee5}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0a0a0a}.player{position:fixed;z-index:30;right:20px;bottom:20px;display:flex;align-items:center;gap:12px;padding:8px 9px 8px 15px;border:1px solid #e8dfc944;border-radius:40px;background:rgba(20,20,18,.88);backdrop-filter:blur(14px);box-shadow:0 8px 30px #101a1638}.copy{display:flex;flex-direction:column;gap:2px;min-width:100px}.copy strong{font:500 11px Georgia,serif;letter-spacing:.16em}.copy small{font:10px Arial,sans-serif;color:#d0d0c4a8}#music-toggle{display:grid;place-items:center;width:42px;height:42px;border:1px solid #e8dfc966;border-radius:50%;background:#c49a67;color:#20201b;font-size:17px;cursor:pointer}#music-toggle:focus-visible{outline:2px solid #f2eee5;outline-offset:4px}@media(max-width:560px){.player{right:12px;bottom:12px}.copy{min-width:82px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><iframe id="mia-space" name="mia-space" src="index.html" title="Mia 的潜意识咖啡馆" allow="autoplay"></iframe><div class="player" aria-label="Mia 全站共享音乐播放器"><div class="copy"><strong>STAY A LITTLE</strong><small id="music-status" aria-live="polite">声音还在这里</small></div><button id="music-toggle" type="button" aria-label="播放背景音乐" title="播放背景音乐">♫</button></div><audio id="mia-shared-music" loop preload="metadata"><source src="mia-background.mp3" type="audio/mpeg"></audio><script>
(()=>{const frame=document.getElementById('mia-space');try{const initial=new URLSearchParams(location.search).get('space');if(initial==='bar')frame.src='bar.html';else if(initial==='music')frame.src='music.html';else if(initial==='greenhouse')frame.src='greenhouse.html';else if(initial==='archive')frame.src='archive.html'}catch(_){}const music=document.getElementById('mia-shared-music'),button=document.getElementById('music-toggle'),status=document.getElementById('music-status');const enabledKey='mia-music-enabled',timeKey='mia-music-time';music.volume=.22;function read(k){try{return localStorage.getItem(k)}catch(_){return null}}function write(k,v){try{localStorage.setItem(k,v)}catch(_){}}function paint(playing){button.textContent=playing?'Ⅱ':'♫';button.setAttribute('aria-label',playing?'暂停背景音乐':'播放背景音乐');button.title=playing?'暂停背景音乐':'播放背景音乐';status.textContent=playing?'声音正轻轻流动':'点一下，让声音回来'}function save(){const k=timeKey+':'+(music.getAttribute('data-track')||'mia-background.mp3');if(Number.isFinite(music.currentTime)&&music.currentTime>0)write(k,String(music.currentTime))}music.addEventListener('timeupdate',save);window.addEventListener('pagehide',save);music.addEventListener('loadedmetadata',()=>{const t=Number(read(timeKey+':'+(music.getAttribute('data-track')||'mia-background.mp3')));if(Number.isFinite(t)&&t>=0&&Number.isFinite(music.duration)&&music.duration>0)music.currentTime=t%music.duration;if(read(enabledKey)==='yes')music.play().then(()=>paint(true)).catch(()=>paint(false))},{once:true});if(read(enabledKey)==='yes')music.load();button.addEventListener('click',async()=>{if(music.paused){try{const t=Number(read(timeKey+':'+(music.getAttribute('data-track')||'mia-background.mp3')));if(t>0&&music.currentTime<.5&&music.readyState>=1&&Number.isFinite(music.duration)&&music.duration>0)music.currentTime=t%music.duration;await music.play();write(enabledKey,'yes');paint(true)}catch(_){paint(false);status.textContent='请再点一次，允许浏览器播放声音'}}else{music.pause();write(enabledKey,'no');save();paint(false)}});music.addEventListener('play',()=>paint(true));music.addEventListener('pause',()=>paint(false));const trackNames={'mia-background.mp3':'深蓝 · Mia 原声','琥珀色的光斑 (1).mp3':'琥珀色的光斑','The Forest of Dreams.mp3':'The Forest of Dreams'};const trackKey='mia-music-track';function changeTrack(track,title){if(!Object.prototype.hasOwnProperty.call(trackNames,track))return;const current=music.getAttribute('data-track')||'mia-background.mp3';if(current!==track){if(Number.isFinite(music.currentTime)&&music.currentTime>0)write(timeKey+':'+current,String(music.currentTime));music.pause();music.src=track;music.setAttribute('data-track',track);write(trackKey,track);music.load()}status.textContent='准备播放 · '+(title||trackNames[track]);music.play().then(()=>{write(enabledKey,'yes');paint(true)}).catch(()=>{paint(false);status.textContent='已选 '+(title||trackNames[track])+' · 点击右下角播放'})}const remembered=read(trackKey);if(remembered&&Object.prototype.hasOwnProperty.call(trackNames,remembered)){music.src=remembered;music.setAttribute('data-track',remembered)}else music.setAttribute('data-track','mia-background.mp3');window.addEventListener('message',e=>{if(!e.data||typeof e.data!=='object')return;if(e.data.type==='mia:track'){changeTrack(e.data.track,e.data.title)}else if(e.data.type==='mia:enter'||e.data.type==='mia:play'){if(music.paused)music.play().then(()=>{write(enabledKey,'yes');paint(true)}).catch(()=>{status.textContent='点击右下角开启声音'})}});paint(false)})();
</script></body></html>
