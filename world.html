<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#202b30">
<title>Mia — A World That Keeps Listening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--paper:#f4f1ea;--moss:#89917c;--deep:#202b30}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--deep);color:var(--paper)}
body{font-family:"Noto Serif SC",serif}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
.listening-mark{position:fixed;z-index:20;top:17px;left:20px;display:flex;align-items:center;gap:10px;padding:9px 13px;border:1px solid #f4f1ea33;border-radius:30px;background:#202b30b8;backdrop-filter:blur(12px);color:var(--paper);text-decoration:none;font:500 11px "Cormorant Garamond",serif;letter-spacing:.17em;transition:opacity .3s}
.listening-mark span{width:6px;height:6px;border-radius:50%;background:var(--moss);box-shadow:0 0 10px #aab59a80}
.player{position:fixed;z-index:30;right:20px;bottom:20px;display:flex;align-items:center;gap:12px;padding:8px 9px 8px 15px;border:1px solid #e8dfc944;border-radius:40px;background:rgba(32,43,48,.91);backdrop-filter:blur(14px);box-shadow:0 8px 30px #101a1638}
.player-copy{display:flex;flex-direction:column;gap:2px;min-width:100px}.player-copy strong{font:500 11px "Cormorant Garamond",serif;letter-spacing:.16em}.player-copy small{font-size:10px;color:#d0d0c4a8}
#music-toggle{display:grid;place-items:center;width:42px;height:42px;border:1px solid #e8dfc966;border-radius:50%;background:#89917c;color:#202b30;font-size:17px;cursor:pointer;transition:transform .25s,background .25s}
#music-toggle:hover{transform:scale(1.05);background:#aab39c}#music-toggle:focus-visible,.listening-mark:focus-visible{outline:2px solid var(--paper);outline-offset:4px}
@media(max-width:560px){.listening-mark{top:10px;left:10px;padding:8px 11px}.player{right:12px;bottom:12px}.player-copy{min-width:85px}.player-copy small{max-width:100px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<iframe id="mia-space" src="index.html?embed=1" title="Mia 的世界" allow="autoplay"></iframe>
<a class="listening-mark" href="index.html" target="mia-space" aria-label="回到 Mia 首页"><span></span>M I A <span style="width:auto;height:auto;background:none;box-shadow:none">· CONTINUOUS LISTENING</span></a>
<div class="player" aria-label="Mia 共享背景音乐播放器">
  <div class="player-copy"><strong>STAY A LITTLE</strong><small id="music-status" aria-live="polite">声音还在这里</small></div>
  <button id="music-toggle" type="button" aria-label="播放背景音乐" title="播放背景音乐">♫</button>
</div>
<audio id="mia-shared-music" loop preload="metadata">
  <source src="mia-background.mp3" type="audio/mpeg">
</audio>
<script>
(() => {
  const music = document.getElementById('mia-shared-music');
  const toggle = document.getElementById('music-toggle');
  const status = document.getElementById('music-status');
  const enabledKey = 'mia-music-enabled';
  const timeKey = 'mia-music-time';
  music.volume = 0.22;
  function read(key){try{return localStorage.getItem(key)}catch(_){return null}}
  function write(key,value){try{localStorage.setItem(key,value)}catch(_){}}
  function savePosition(){if(Number.isFinite(music.currentTime)&&music.currentTime>0)write(timeKey,String(music.currentTime))}
  function paint(playing){
    toggle.textContent=playing?'Ⅱ':'♫';
    toggle.setAttribute('aria-label',playing?'暂停背景音乐':'播放背景音乐');
    toggle.title=playing?'暂停背景音乐':'播放背景音乐';
    status.textContent=playing?'声音正轻轻流动':'点一下，让声音回来';
  }
  music.addEventListener('timeupdate',savePosition);
  window.addEventListener('pagehide',savePosition);
  music.addEventListener('loadedmetadata',()=>{
    const saved=Number(read(timeKey));
    if(Number.isFinite(saved)&&saved>=0&&Number.isFinite(music.duration)&&music.duration>0)music.currentTime=saved%music.duration;
    if(read(enabledKey)==='yes')music.play().then(()=>paint(true)).catch(()=>paint(false));
  },{once:true});
  if(read(enabledKey)==='yes')music.load();
  toggle.addEventListener('click',async()=>{
    if(music.paused){
      try{
        const saved=Number(read(timeKey));
        if(Number.isFinite(saved)&&saved>0&&music.currentTime<.5&&music.readyState>=1&&Number.isFinite(music.duration)&&music.duration>0)music.currentTime=saved%music.duration;
        await music.play();write(enabledKey,'yes');paint(true);
      }catch(_){paint(false);status.textContent='请再点一次，允许浏览器播放声音'}
    }else{music.pause();write(enabledKey,'no');savePosition();paint(false)}
  });
  music.addEventListener('play',()=>paint(true));
  music.addEventListener('pause',()=>paint(false));
  paint(false);
})();
</script>
</body>
</html>
