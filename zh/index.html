<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Mia 的潜意识咖啡馆：在迷雾、音乐、森林与记忆之间，给自己一点留白。">
<title>Mia — 迷雾大厅</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0a0a0a;color:#e9e3d7}
body{min-height:100svh;overflow:hidden;font-family:"Noto Serif SC",serif;background:radial-gradient(ellipse at 50% 52%,#252522 0,#151514 37%,#090909 78%)}
.mist{min-height:100svh;display:grid;place-items:center;position:relative;isolation:isolate;padding:28px 20px}
.mist:before,.mist:after{content:"";position:absolute;z-index:-1;pointer-events:none;filter:blur(30px);border-radius:50%;mix-blend-mode:screen}
.mist:before{width:min(60vw,650px);height:min(60vw,650px);background:radial-gradient(circle,#c6bda31b 0,#7b82752b 24%,transparent 68%);left:10%;top:13%;animation:drift 19s ease-in-out infinite alternate}
.mist:after{width:min(54vw,560px);height:min(54vw,560px);background:radial-gradient(circle,#b7a88d20 0,#747b7620 28%,transparent 68%);right:5%;bottom:8%;animation:drift 23s ease-in-out infinite alternate-reverse}
.fog{position:absolute;inset:0;z-index:-1;opacity:.5;background:repeating-radial-gradient(ellipse at 50% 52%,transparent 0 9%,#d9d1c405 10%,transparent 17%);animation:fogmove 34s linear infinite}
.content{text-align:center;width:min(680px,100%);animation:appear 2s both}
.symbol{width:78px;height:78px;margin:0 auto 34px;position:relative;border:1px solid #e7dfca26;border-radius:50%;display:grid;place-items:center}
.symbol:before,.symbol:after{content:"";position:absolute;border:1px solid #e7dfca20;border-radius:50%;inset:8px;animation:orbit 16s linear infinite}
.symbol:after{inset:-7px;border-style:dashed;animation-duration:35s}.symbol span{width:9px;height:9px;border-radius:50%;background:#c4b59a;box-shadow:0 0 28px 8px #c4b59a2b}
.kicker{font:500 11px "Cormorant Garamond",serif;letter-spacing:.32em;color:#c8c0b0a0}
.line{font:400 clamp(18px,3vw,25px)/1.95 "Noto Serif SC",serif;letter-spacing:.06em;color:#d9d1c3;margin:24px 0 11px;min-height:2em}
.sub{font:400 14px "Noto Serif SC",serif;letter-spacing:.12em;color:#bdb4a5}
.actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:42px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-width:230px;min-height:48px;padding:13px 20px;border:1px solid #d7c8ad55;background:transparent;color:#e9e3d7;text-decoration:none;font:12px "Noto Serif SC",serif;letter-spacing:.08em;cursor:pointer;transition:background .3s,border-color .3s}
.button:hover{background:#c49a6714;border-color:#c49a67}.note{font:12px/1.9 "Noto Serif SC",serif;color:#aaa397;margin-top:16px}.bottom{position:absolute;bottom:24px;left:0;right:0;text-align:center;font:10px "Cormorant Garamond",serif;letter-spacing:.2em;color:#b8b1a23e}
.language{position:fixed;z-index:5;top:max(18px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));font:11px Arial,sans-serif;letter-spacing:.12em;color:#d8cfbd;text-decoration:none;border:1px solid #e8dfc933;border-radius:30px;padding:9px 13px;background:#14141299;backdrop-filter:blur(12px)}
@keyframes drift{from{transform:translate3d(-5%,2%,0) scale(.9)}to{transform:translate3d(7%,-4%,0) scale(1.15)}}@keyframes fogmove{from{transform:translateX(-2%) rotate(0)}to{transform:translateX(2%) rotate(3deg)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:680px){.symbol{width:66px;height:66px;margin-bottom:27px}.kicker{font-size:9px;letter-spacing:.2em;line-height:1.8}.line{font-size:clamp(17px,4.8vw,21px);line-height:1.9;margin:19px 0 10px}.sub{font-size:12px;line-height:1.9;letter-spacing:.08em}.actions{margin-top:30px}.button{width:min(320px,100%);font-size:11px}.bottom{position:relative;bottom:auto;padding-top:25px;font-size:9px;line-height:1.8}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<a class="language" href="../en/" hreflang="en" lang="en" aria-label="Switch to English">EN</a>
<main class="mist"><div class="fog" aria-hidden="true"></div><section class="content">
<div class="symbol" aria-hidden="true"><span></span></div>
<div class="kicker">A QUIET PLACE BETWEEN THOUGHTS</div>
<p id="time-line" class="line">有些答案，不必在今天出现。</p>
<p class="sub">欢迎来到 Mia 的潜意识咖啡馆</p>
<div class="actions">
<a class="button" href="../world.html?space=bar&lang=zh">STAY A LITTLE · 进入空间 ↗</a>
<a class="button" href="../world.html?space=time-capsule&lang=zh">TIME CAPSULE · 记忆的琥珀 ↗</a>
</div>
<p class="note">声音只在你愿意时开始。你也可以随时离开。</p>
</section><div class="bottom">BREATHE IN · LET THE WORLD WAIT</div></main>
<script>
(()=>{const line=document.getElementById('time-line'),h=new Date().getHours();const lines=h<5?['夜还很深，不必急着想明白。','让未完成的念头先睡一会儿。']:h<11?['清晨不需要立刻成为答案。','把今天留一点空白给自己。']:h<17?['允许自己此刻无意义。','不是每一种安静，都需要解释。']:h<21?['天色渐暗，心可以慢一点。','把今天没说完的话，轻轻放下。']:['夜晚适合收藏没有结论的事。','有些答案，不必在今天出现。'];line.textContent=lines[Math.floor(Math.random()*lines.length)];})();
</script>
</body></html>
