<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<title>Mia — The Mist</title>
<script>
(()=> {
  const params=new URLSearchParams(location.search);
  const requested=(params.get('lang')||'').toLowerCase();
  const locale=requested==='zh'||requested==='zh-cn'?'zh':'en';
  const target=new URL(locale+'/',location.href);
  target.search=location.search;
  target.hash=location.hash;
  target.searchParams.set('lang',locale);
  location.replace(target.href);
})();
</script>
</head>
<body>
<p><a href="en/">Enter Mia's Subconscious Café</a> · <a href="zh/">进入 Mia 的潜意识咖啡馆</a></p>
</body>
</html>
