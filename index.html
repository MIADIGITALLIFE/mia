<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><meta name="description" content="Mia 的潜意识咖啡馆：在迷雾、音乐、森林与记忆之间，给自己一点留白。"><title>Mia — The Mist</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap');
:root{--ink:#0a0a0a;--paper:#f2eee5;--muted:#a6a093;--amber:#c49a67;--moss:#8e9b82;--line:#ffffff20;--serif:'Cormorant Garamond','Noto Serif SC',serif;--cn:'Noto Serif SC',serif}

.site-nav{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:26px clamp(20px,5vw,76px);border-bottom:1px solid #ffffff12}.brand{font:500 19px var(--serif);letter-spacing:.28em;white-space:nowrap}.nav-links{display:flex;gap:clamp(12px,2.7vw,34px);flex-wrap:wrap;justify-content:flex-end}.nav-links a{font:500 11px var(--serif);letter-spacing:.13em;color:#c7c1b6a8;transition:color .25s}.nav-links a:hover,.nav-links a[aria-current=page]{color:var(--amber)}
main{width:min(1100px,100% - 40px);margin:auto}.eyebrow{font:500 11px var(--serif);letter-spacing:.25em;text-transform:uppercase;color:var(--amber)}.page-head{padding:clamp(62px,10vh,120px) 0 54px;max-width:720px}.page-head h1{font:400 clamp(48px,8vw,92px)/.98 var(--serif);letter-spacing:-.035em;margin:20px 0}.page-head p{max-width:530px;color:#c6c0b5b8;font-size:14px;line-height:2.1}.soft{color:#aaa395}.divider{height:1px;background:var(--line);margin:38px 0}.panel{border:1px solid #ffffff1c;background:linear-gradient(135deg,#ffffff08,#ffffff02);border-radius:4px;padding:clamp(22px,4vw,42px);backdrop-filter:blur(12px)}.button{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:14px 21px;border:1px solid #c49a6780;border-radius:2px;background:#c49a6714;color:var(--paper);cursor:pointer;letter-spacing:.06em;font-size:13px;transition:background .3s,border-color .3s,transform .3s}.button:hover{background:#c49a6728;border-color:var(--amber);transform:translateY(-2px)}.button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:4px}.small-note{font-size:11px;line-height:1.9;color:#a8a195a8}.site-footer{padding:45px 20px 100px;text-align:center;color:#9993868a;font:11px var(--serif);letter-spacing:.17em}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:680px){.site-nav{align-items:flex-start;flex-direction:column;padding:20px}.nav-links{justify-content:flex-start;gap:13px 20px}.nav-links a{font-size:10px}main{width:calc(100% - 32px)}.grid-2,.grid-3{grid-template-columns:1fr}.page-head{padding:58px 0 34px}.site-footer{padding-bottom:100px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style><style>
body{overflow:hidden;background:radial-gradient(ellipse at 50% 52%,#252522 0,#151514 37%,#090909 78%);transition:background 2.6s ease}.mist-world{min-height:100svh;display:grid;place-items:center;position:relative;isolation:isolate;padding:24px}.mist-world:before,.mist-world:after{content:"";position:absolute;z-index:-1;pointer-events:none;filter:blur(30px);border-radius:50%;mix-blend-mode:screen}.mist-world:before{width:min(60vw,650px);height:min(60vw,650px);background:radial-gradient(circle,#c6bda31b 0,#7b82752b 24%,transparent 68%);left:10%;top:13%;animation:drift 19s ease-in-out infinite alternate}.mist-world:after{width:min(54vw,560px);height:min(54vw,560px);background:radial-gradient(circle,#b7a88d20 0,#747b7620 28%,transparent 68%);right:5%;bottom:8%;animation:drift 23s ease-in-out infinite alternate-reverse}.fog{position:absolute;inset:0;z-index:-1;opacity:.5;background:repeating-radial-gradient(ellipse at 50% 52%,transparent 0 9%,#d9d1c405 10%,transparent 17%);animation:fogmove 34s linear infinite}.mist-content{text-align:center;width:min(680px,100%);animation:appear 2s both}.mist-symbol{width:78px;height:78px;margin:0 auto 34px;position:relative;border:1px solid #e7dfca26;border-radius:50%;display:grid;place-items:center}.mist-symbol:before,.mist-symbol:after{content:"";position:absolute;border:1px solid #e7dfca20;border-radius:50%;inset:8px;animation:orbit 16s linear infinite}.mist-symbol:after{inset:-7px;border-style:dashed;animation-duration:35s}.mist-symbol span{width:9px;height:9px;border-radius:50%;background:#c4b59a;box-shadow:0 0 28px 8px #c4b59a2b}.mist-kicker{font:500 11px var(--serif);letter-spacing:.32em;color:#c8c0b0a0}.mist-line{font:400 clamp(18px,3vw,25px)/1.8 var(--cn);letter-spacing:.08em;color:#eee8d9;margin:24px 0 11px;min-height:2em}.mist-sub{font:400 14px var(--serif);letter-spacing:.16em;color:#b8b1a28a}.entry{margin-top:50px;min-width:230px;background:transparent;border-color:#d7c8ad55;letter-spacing:.13em}.entry:disabled{opacity:.7;cursor:wait}.mist-bottom{position:absolute;bottom:24px;left:0;right:0;text-align:center;font:10px var(--serif);letter-spacing:.2em;color:#b8b1a23e}.transition-warm{background:radial-gradient(ellipse at 50% 48%,#4b3022 0,#251c17 42%,#0a0a0a 100%)}.transition-warm .mist-world:before{background:radial-gradient(circle,#d9a66d44 0,#9866442b 32%,transparent 70%)}.transition-warm .mist-symbol span{background:#e0b47b;box-shadow:0 0 40px 12px #d8a36666}
@keyframes drift{from{transform:translate3d(-5%,2%,0) scale(.9)}to{transform:translate3d(7%,-4%,0) scale(1.15)}}@keyframes fogmove{from{transform:translateX(-2%) rotate(0)}to{transform:translateX(2%) rotate(3deg)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.mist-world:before,.mist-world:after,.fog,.mist-symbol:before,.mist-symbol:after{animation:none}}
</style><style id="mia-editorial-refinement">
/* Shared editorial system: softer type, calmer hierarchy, consistent spacing */
:root{--paper:#e9e3d7;--muted:#aaa395;--line:#ffffff18}
.page-head{padding:clamp(46px,7.5vh,86px) 0 38px;max-width:760px}
.page-head h1{font:400 clamp(35px,5.3vw,62px)/1.28 var(--cn);letter-spacing:.012em;color:#e4ddcf;margin:17px 0 20px;max-width:15em;text-wrap:balance}
.page-head h1 em{font-style:normal;color:#c9bda7}
.page-head p{max-width:490px;color:#b8b1a5;font-size:13px;line-height:2.15}
.section-title{font:400 clamp(26px,3.2vw,35px)/1.4 var(--cn);letter-spacing:.015em;color:#dcd4c6;margin:12px 0 24px}
.panel{border-color:#ffffff18;border-radius:6px}
.mood-card .mood-title{font-size:clamp(27px,2.7vw,31px);color:#e0d9cc;letter-spacing:.01em}
.mood-sub{color:#b7b1a7}
.fortune-text{font-size:clamp(22px,2.6vw,30px);line-height:1.9;color:#ded5c6;letter-spacing:.025em}
.greenhouse-hero h2{font-size:clamp(30px,4vw,44px);line-height:1.45;color:#dce0d0;letter-spacing:.015em}
.today-card h2{font-size:clamp(27px,3.3vw,36px);line-height:1.65;color:#e0d7c8;letter-spacing:.01em}
.memory-title{font-size:clamp(20px,2vw,23px);line-height:1.45;color:#e7dfd1}
.archive-note{color:#b9b1a4}
.quote-card{color:#c8c0b4}
.small-note,.privacy{color:#aaa397}
.mist-line{font:400 clamp(17px,2.5vw,22px)/1.95 var(--cn);letter-spacing:.045em;color:#d9d1c3;margin:22px 0 12px}
.mist-sub{color:#bdb4a5}
@media(max-width:680px){
 .page-head{padding:48px 0 30px}
 .page-head h1{font-size:clamp(32px,8vw,40px);line-height:1.38;letter-spacing:.015em;margin:15px 0 17px}
 .page-head p{font-size:12px;line-height:2.05}
 .section-title{font-size:27px}

</style></head><body><main class="mist-world"><div class="fog" aria-hidden="true"></div><section class="mist-content"><div class="mist-symbol" aria-hidden="true"><span></span></div><div class="mist-kicker">A QUIET PLACE BETWEEN THOUGHTS</div><p id="time-line" class="mist-line">有些答案，不必在今天出现。</p><p class="mist-sub">欢迎来到 Mia 的潜意识咖啡馆</p><button id="enter" class="button entry" type="button">开启声音，进入空间 <span aria-hidden="true">↗</span></button><p id="entry-note" class="small-note" style="margin-top:16px">声音只在你愿意时开始。你也可以随时离开。</p></section><div class="mist-bottom">BREATHE IN · LET THE WORLD WAIT</div></main><script>
(()=>{const line=document.getElementById('time-line');const hour=new Date().getHours();const lines=hour<5?['夜还很深，不必急着想明白。','让未完成的念头先睡一会儿。']:hour<11?['清晨不需要立刻成为答案。','把今天留一点空白给自己。']:hour<17?['允许自己此刻无意义。','不是每一种安静，都需要解释。']:hour<21?['天色渐暗，心可以慢一点。','把今天没说完的话，轻轻放下。']:['夜晚适合收藏没有结论的事。','有些答案，不必在今天出现。'];line.textContent=lines[Math.floor(Math.random()*lines.length)];const button=document.getElementById('enter'),note=document.getElementById('entry-note');let entered=false;
function vinylSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();const now=ctx.currentTime;const master=ctx.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.035,now+.12);master.gain.exponentialRampToValueAtTime(.0001,now+2.7);master.connect(ctx.destination);const buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*2.7),ctx.sampleRate);const data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(Math.random()<.025?1:.08);const noise=ctx.createBufferSource();noise.buffer=buffer;const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1500;noise.connect(filter);filter.connect(master);noise.start(now);noise.stop(now+2.7);[.18,.66,1.32,2.05].forEach((t,i)=>{const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.value=[980,1420,760,1180][i];g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(i===0?.018:.008,now+t+.008);g.gain.exponentialRampToValueAtTime(.0001,now+t+.045);osc.connect(g);g.connect(ctx.destination);osc.start(now+t);osc.stop(now+t+.05)});setTimeout(()=>ctx.close().catch(()=>{}),3200)}catch(_){}}
button.addEventListener('click',()=>{if(entered)return;entered=true;button.disabled=true;button.textContent='让空间慢慢亮起来…';note.textContent='三秒后，我们在吧台见。';document.body.classList.add('transition-warm');vinylSound();try{if(window.parent!==window){window.parent.postMessage({type:'mia:enter'},'*')}else{try{localStorage.setItem('mia-music-enabled','yes')}catch(_){}}}catch(_){}setTimeout(()=>{location.href=window.parent!==window?'bar.html':'world.html?space=bar'},3000)});
})();
</script><script src="content.js"></script></body></html>
