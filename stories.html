<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111311">
<meta name="description" content="Mia 故事档案馆：收藏关于意识、人类、未来与想象的故事。">
<title>THE STORY ARCHIVE — Mia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{--bg:#101311;--paper:#e9e3d7;--muted:#aaa397;--gold:#c4a47a;--line:#ffffff20;--serif:'Cormorant Garamond',serif;--cn:'Noto Serif SC',serif;--art:'ZCOOL XiaoWei','Noto Serif SC',serif}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--paper);font-family:var(--cn);background:radial-gradient(ellipse at 50% 0%,#39423955,transparent 42%),linear-gradient(160deg,#151b17,#0b0e0c 70%)}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px clamp(20px,5vw,70px);border-bottom:1px solid #ffffff15}.brand{font:500 19px var(--serif);letter-spacing:.3em}.nav-back{font:12px var(--serif);letter-spacing:.14em;color:#c9c1b3}.wrap{width:min(1040px,calc(100% - 40px));margin:auto}.hero{padding:clamp(65px,11vh,120px) 0 54px;max-width:760px}.eyebrow{font:11px var(--serif);letter-spacing:.25em;color:var(--gold)}h1{font:400 clamp(43px,7vw,78px)/1.15 var(--art);letter-spacing:.04em;margin:20px 0 14px}.subtitle{font:italic clamp(17px,2.5vw,22px) var(--serif);letter-spacing:.08em;color:#c8c0b2}.intro{max-width:590px;color:#b8b3a8;font-size:13px;line-height:2.2;margin-top:24px}.rule{height:1px;background:var(--line);margin:35px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:0 0 20px}.section-head h2{font:400 27px var(--art);margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.filter{border:1px solid #ffffff26;background:transparent;color:#c9c1b3;padding:8px 12px;font:11px var(--cn);cursor:pointer}.filter[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:#c4a47a12}.count{font:11px var(--serif);letter-spacing:.15em;color:var(--muted)}.collection{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.story-card{display:grid;grid-template-columns:minmax(125px,.72fr) 1fr;min-height:260px;border:1px solid #ffffff20;background:linear-gradient(135deg,#ffffff0b,#ffffff02);transition:border-color .3s,transform .3s;overflow:hidden}.story-card:hover{border-color:#c4a47a80;transform:translateY(-3px)}.cover{min-height:260px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 52% 38%,#aeb9a544,transparent 28%),radial-gradient(ellipse at 50% 52%,#61776b55,transparent 54%),linear-gradient(150deg,#25342d,#101a19 68%,#090d0d);display:grid;place-items:center}.cover-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.cover:before,.cover:after{content:"";position:absolute;border:1px solid #d7d5c433;border-radius:50%;width:70%;aspect-ratio:1;transform:rotate(-28deg) scaleY(.35)}.cover:after{width:90%;transform:rotate(42deg) scaleY(.42);border-color:#d7d5c422}.cover-mark{font:400 36px var(--serif);color:#e7e1d2aa;letter-spacing:.08em;z-index:1}.card-copy{padding:24px 22px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.number{font:11px var(--serif);letter-spacing:.2em;color:var(--gold)}.card-copy h3{font:400 clamp(23px,3vw,30px) var(--art);margin:16px 0 4px}.english{font:italic 14px var(--serif);letter-spacing:.08em;color:#aaa397}.description{font-size:12px;line-height:2;color:#bcb6aa;margin:17px 0}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}.tag{font-size:10px;color:#c7bdac;border:1px solid #ffffff20;padding:5px 8px}.open{margin-top:20px;font:11px var(--serif);letter-spacing:.17em;color:var(--gold)}.empty{color:var(--muted);font-size:13px;line-height:2;padding:35px 0}.footer{text-align:center;padding:70px 15px 45px;color:#918d83;font:11px var(--serif);letter-spacing:.2em}
@media(max-width:650px){nav{padding:18px 16px}.wrap{width:calc(100% - 32px)}.hero{padding:56px 0 35px}.collection{grid-template-columns:1fr;gap:14px}.story-card{grid-template-columns:112px 1fr;min-height:220px}.cover{min-height:220px}.card-copy{padding:18px 15px}.description{margin:12px 0;font-size:11px}.card-copy h3{font-size:24px}.section-head h2{font-size:24px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<nav><a class="brand" href="index.html">M I A</a><a class="nav-back" href="world.html?space=archive">← RETURN TO MIA</a></nav>
<main class="wrap">
<header class="hero"><div class="eyebrow">A QUIET COLLECTION OF FICTION · 05 / THE STORY ARCHIVE</div><h1>故事档案馆</h1><div class="subtitle">Stories from the edge of imagination.</div><p class="intro">每一个故事，都是一扇通往未知的门。这里收藏关于意识、人类、未来与想象的作品。你可以慢慢读，不必急着抵达结论。</p></header>
<div class="rule"></div>
<section aria-labelledby="collection-title"><div class="section-head"><h2 id="collection-title">文学收藏</h2><span class="count" id="story-count">COLLECTION · LOADING</span></div><div class="filters" id="story-filters" aria-label="按分类筛选"><button class="filter" type="button" data-category="全部" aria-pressed="true">全部作品</button></div><div class="collection" id="story-list" aria-live="polite"><p class="empty">故事正在整理，请稍候……</p></div></section>
</main>
<footer class="footer">MIA · THE STORY ARCHIVE</footer>
<script>
(async()=>{const list=document.getElementById('story-list'),count=document.getElementById('story-count'),filters=document.getElementById('story-filters');let visibleStories=[],active='全部';const render=()=>{list.replaceChildren();visibleStories=allStories.filter(s=>active==='全部'||(s.category||[]).includes(active));count.textContent='COLLECTION · '+String(visibleStories.length).padStart(2,'0');if(!visibleStories.length){const p=document.createElement('p');p.className='empty';p.textContent='这个分类暂时还没有公开作品。';list.appendChild(p);return}visibleStories.forEach(story=>{const card=document.createElement('a');card.className='story-card';card.href='story.html?id='+encodeURIComponent(story.id);const cover=document.createElement('div');cover.className='cover';if(story.cover){const image=document.createElement('img');image.className='cover-image';image.src=story.cover;image.alt=(story.title||'故事')+'封面';image.loading='lazy';cover.appendChild(image)}const mark=document.createElement('span');mark.className='cover-mark';mark.textContent='M · '+String(story.number||'').replace('NO.','');cover.appendChild(mark);const copy=document.createElement('div');copy.className='card-copy';const number=document.createElement('span');number.className='number';number.textContent=(story.number||'STORY')+' · '+(story.status||'收藏');const title=document.createElement('h3');title.textContent=story.title||'未命名故事';const english=document.createElement('span');english.className='english';english.textContent=story.englishTitle||'';const desc=document.createElement('p');desc.className='description';desc.textContent=story.description||'';const tags=document.createElement('div');tags.className='tags';(story.category||[]).forEach(value=>{const tag=document.createElement('span');tag.className='tag';tag.textContent=value;tags.appendChild(tag)});const open=document.createElement('span');open.className='open';open.textContent='ENTER THE STORY ↗';copy.append(number,title,english,desc,tags,open);card.append(cover,copy);list.appendChild(card)})};let allStories=[];try{const res=await fetch('data/stories.json',{cache:'no-store'});if(!res.ok)throw new Error('catalog unavailable');const data=await res.json();allStories=(Array.isArray(data.stories)?data.stories:[]).filter(s=>s.status!=='草稿').sort((a,b)=>(b.publishedAt||'').localeCompare(a.publishedAt||'')||(a.series||'').localeCompare(b.series||'')||(a.seriesOrder||0)-(b.seriesOrder||0));const categories=[...new Set(allStories.flatMap(s=>s.category||[]))];categories.forEach(category=>{const button=document.createElement('button');button.className='filter';button.type='button';button.dataset.category=category;button.textContent=category;button.setAttribute('aria-pressed','false');filters.appendChild(button)});filters.addEventListener('click',event=>{const button=event.target.closest('button[data-category]');if(!button)return;active=button.dataset.category;filters.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()});render()}catch(error){count.textContent='COLLECTION';list.innerHTML='<p class="empty">暂时无法读取故事目录。请稍后刷新页面。</p>'}})();
</script>
</body></html>
